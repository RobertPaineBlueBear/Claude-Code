<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Morning Briefing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }

    .greeting {
      text-align: center;
      margin-bottom: 24px;
    }

    .greeting h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .greeting .date {
      font-size: 14px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .weather {
      text-align: center;
    }

    .weather .temp {
      font-size: 72px;
      font-weight: 300;
    }

    .weather .condition {
      font-size: 18px;
      opacity: 0.85;
      margin-top: 4px;
    }

    .error {
      margin-top: 24px;
      color: #ffcccc;
      font-size: 14px;
      text-align: center;
    }

    .loading {
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="greeting">
    <h1 id="greeting-text">...</h1>
    <div class="date" id="date-text"></div>
  </div>

  <div class="weather" id="weather-card" style="display: none;">
    <div class="temp" id="temp-text"></div>
    <div class="condition" id="condition-text"></div>
  </div>

  <div class="loading" id="loading">Loading weather...</div>
  <div class="error" id="error" style="display: none;"></div>

  <script src="renderer.js"></script>
</body>
</html>
